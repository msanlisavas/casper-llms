name: check

# Every week: is each catalogued capability still reachable, and was each guide verified against
# the latest releases? Findings go to ONE tracking issue, which a clean run closes. Nothing in the
# repository is edited: a person fixes catalog.json or re-verifies the guide.
on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC, after the regenerate run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  # Talks to every listed host, so it gets no write scope at all. check.py exits 0 when there is
  # nothing to fix, 3 when the report lists findings, and anything else when it crashed.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Probe the catalog and the guides
        id: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check.py --report report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-check-report
          path: report.md
          if-no-files-found: ignore
          retention-days: 14

  # Writes issues and nothing else, from the report alone; it never touches a listed host.
  issue:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Fail on a crashed check
        env:
          STATUS: ${{ needs.probe.outputs.status }}
        run: |
          if [ "$STATUS" != "0" ] && [ "$STATUS" != "3" ]; then
            echo "check.py crashed (exit status '$STATUS'); see the probe job's log. The tracking issue was not touched."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.probe.outputs.status == '3'
        with:
          name: weekly-check-report
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ needs.probe.outputs.status }}
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label weekly-check --state open \
            --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The latest weekly check found nothing to fix."
            fi
            exit 0
          fi
          if [ ! -s report.md ]; then
            echo "The probe reported findings but left no report."
            exit 1
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh label create weekly-check --repo "$GITHUB_REPOSITORY" --color D93F0B \
              --description "Found by the weekly catalog and guide check" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label weekly-check \
              --title "Weekly check: capabilities to fix or guides to re-verify" --body-file report.md
          fi
