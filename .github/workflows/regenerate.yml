name: regenerate

# New and removed upstream pages only reach the indexes when they are regenerated. Edits to
# existing pages need nothing: the indexes link branches, so readers always fetch the latest.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

# Least privilege: read-only by default, write only for the one job that pushes.
permissions:
  contents: read

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # main is protected by a ruleset that only the owner and this repository's deploy key may
    # bypass: a personal repository cannot list the GitHub Actions app as a bypass actor. So the
    # push goes over SSH with that deploy key (a repository-only credential), and GITHUB_TOKEN
    # stays read-only - it is used only for the GitHub API calls the generator makes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.REGENERATE_DEPLOY_KEY }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py
      # main is protected and this job is allowed to push to it directly, so nothing it
      # generates is reviewed first. It must not publish an index that fails validation.
      - name: Validate
        run: python scripts/validate.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Indexes unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate indexes from upstream"
          git push
